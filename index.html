    <script>
      (function () {
        var globalKey = 'zk_public_theme_mode';
        var personalKey = 'zk_personal_color_mode';
        var globalMode = 'auto';
        var isAdmin = function () { return /^\/desk(?:[/-]|$)/.test(location.pathname); };
        var validGlobal = function (value) { return value === 'light' || value === 'dark' || value === 'auto'; };
        var validPersonal = function (value) { return value === 'light' || value === 'dark'; };
        var readPersonal = function () {
          try {
            var personal = localStorage.getItem(personalKey);
            return validPersonal(personal) ? personal : null;
          } catch (_) { return null; }
        };
        var apply = function (requested, cache) {
          globalMode = validGlobal(requested) ? requested : 'auto';
          if (cache !== false) try { localStorage.setItem(globalKey, globalMode); } catch (_) {}
          if (isAdmin()) return;
          var personal = readPersonal();
          var hour = new Date().getHours();
          var resolved = personal || (globalMode === 'dark' || (globalMode === 'auto' && (hour >= 23 || hour < 7)) ? 'dark' : 'light');
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-public-theme', resolved);
          root.setAttribute('data-public-theme-mode', globalMode);
          root.setAttribute('data-color-mode-source', personal ? 'personal' : 'global');
          root.style.colorScheme = resolved;
          root.style.backgroundColor = resolved === 'dark' ? '#0F1722' : '#F8FBFA';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0F1722' : '#F8FBFA');
          return resolved;
        };
        window.__zkApplyPublicMode = function (requested) {
          // A choice the visitor already made on this device beats the baked server default; only the personal/light-dark pick and an explicit global mode are protected.
          var stored = null;
          try { stored = localStorage.getItem(globalKey); } catch (_) {}
          if (stored === 'light' || stored === 'dark') return apply(stored, false);
          return apply(requested);
        };
        var cached = null;
        try { cached = localStorage.getItem(globalKey); } catch (_) {}
        apply(cached, false);
        window.addEventListener('storage', function (event) {
          if (event.key === globalKey) apply(event.newValue, false);
          if (event.key === personalKey) apply(globalMode, false);
        });
        window.setInterval(function () { if (globalMode === 'auto' && !readPersonal()) apply(globalMode, false); }, 60000);
      })();
    </script>
