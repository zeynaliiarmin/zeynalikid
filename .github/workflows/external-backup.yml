name: External encrypted backup

on:
  schedule:
    - cron: "23 2 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-encrypted-backup-zeynalikid
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BACKUP_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.BACKUP_SUPABASE_PROJECT_REF }}
      BACKUP_PROJECT_CODE: zeynalikid
      BACKUP_TARGET: github-artifact
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_RETENTION_DAYS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked backup dependencies
        run: npm ci --ignore-scripts
      - name: Create client-side encrypted backup
        run: node scripts/external-backup.mjs
      - name: Upload encrypted backup artifact
        if: ${{ hashFiles('backup-output/*.zip.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-${{ env.BACKUP_PROJECT_CODE }}-${{ github.run_id }}
          path: backup-output/*.zip.enc
          retention-days: 20
          compression-level: 0
          if-no-files-found: error
